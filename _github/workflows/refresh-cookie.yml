name: Nightly Cookie Refresh

on:
  schedule:
    - cron: '0 17 * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bunx puppeteer browsers install chrome && bun run refresh-cookie.ts
        env:
          CFX_FORUM_COOKIE: ${{ secrets.CFX_FORUM_COOKIE }}
